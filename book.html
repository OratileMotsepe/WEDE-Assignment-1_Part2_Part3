<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--SEO details-->
    <title>Book SoundMax | Book Car Audio Installation</title>
    <meta name="description" content="Book our car audio services, including car audio installtions, rewiring, custom door panels, and custom subwoofer boxes.">
    <meta name="keywords" content="car audio, car sound systems, car service bookings, gallery, budget, quality systems, car audio installations, custom enclosures, car sound rewiring">
    
    <link rel="icon" type="image/png" href="Images/SoundMax Logo Edited.jpeg">
    <!--External CSS stylesheet link-->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<!--Page header-->
    <header>
        <section class="pageheader">
            <img src="Images/SoundMax Logo Edited.jpeg" alt="SoundMax logo">
            <h1 id="pagetitle">SoundMax - Amplify Your Sound Wave</h1>
        </section>
    </header>
<!--Navigation-->
    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book.html">Book</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
    </nav>
<!--Website content-Service options-->
    <main>
        <section class="book">
            <h2 id="book-text1">More services from us</h2>
            <form class="book-form" id="booking-form">
            <!--Client details field-->
                <p>
                    <input type="text" id="name" placeholder="Name: ">
                    <small id="name-error" class="error-message"></small>
                </p>
                <p>
                    <input type="text" id="surname" placeholder="Surname: ">
                    <small id="surname-error" class="error-message"></small>
                </p>
                <p>
                    <input type="tel" id="phone" placeholder="Phone number: ">
                    <small id="phone-error" class="error-message"></small>
                </p>
                <p>
                    <input type="email" id="email" placeholder="Email address: ">
                    <small id="email-error" class="error-message"></small>
                </p>
                <p>
                    <select id="book-button1">
                        <option value="">Select an option</option>
                        <option value="Installation">Installation</option>
                        <option value="Enclosure">Enclosure</option>
                        <option value="Sound rewiring">Sound rewiring</option>
                    </select>
                    <small id="service-error" class="error-message"></small>
                </p>
                <p id="book-text2">Any details you want to specify?</p>
                <textarea 
                    name="comment" 
                    id="comment" 
                    rows="5" 
                    cols="40" 
                    placeholder="Write your comment here..."></textarea>
                    
                <section id="book-button2">
                    <button type="submit">Register</button>
                </section>
                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
<!--Page Footer-->    
    <footer>
    <!--Social media links-->
        <h3 id="footer1">Our socials</h3>
        <section class="Webfoot">
            <a href="https://www.instagram.com/soundmax55?igsh=ZDQ5cnl6cHFjdW03" target="_blank"> <!--Instagram-->
            <img src="Images/instagram.png" alt="SoundMax Instagram account" width="25" height="25">
            </a>
            <a href="https://www.tiktok.com/@sound.max8?is_from_webapp=1&sender_device=pc" target="_blank"> <!--TikTok-->
            <img src="Images/tik-tok.png" alt="SoundMax TikTok account" width="25" height="25">
            </a>
        </section>
        <p id="footer2">&copy; 2026 Oratile Motsepe. All rights reserved</p>
    </footer>

    <!--JavaScript link-->
    <script src="book.js"></script>
</body>
</html>
